title = "zapbip"

[extend]
useDefault = true

[[rules]]
id = "zapbip-operator-key"
description = "A zapbip backoffice operator key, which opens the operator MCP endpoint"
regex = '''zbo_[0-9a-f]{16}_[A-Za-z0-9_-]{43}'''
keywords = ["zbo_"]

[allowlist]
description = "The exact placeholder strings the repository ships on purpose, each anchored to the whole secret"
regexes = [
  '''^zapbip-test-secret-with-at-least-32-characters$''',
  '''^3b7d80fc9a4468769bc3a4505f06222a777b80a0732c9dcd3e03df05e876e37c$''',
  '''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''',
  '''^zb_conn_ex4mPLe7Hq2xVn9Rt4Wm8Ls3Jd6Hf1Yb5Gc0Zk2Ns7q$''',
  '''^ex4mPLe7Hq2xVn9Rt4Wm8Ls3Jd6Hf1Yb5Gc0Zk2Ns7q$''',
  '''^arquivo-789\.pdf$''',
]
