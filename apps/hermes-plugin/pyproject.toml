[project]
name = "zapbip-platform"
version = "0.0.1"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["gateway", "gateway.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "zapbip_platform.adapter"
disallow_subclassing_any = false
