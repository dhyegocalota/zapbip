<rect x="100" y="320" width="260" height="100" rx="16" fill="#D9FDD3" stroke="#128C7E" stroke-width="3"/>
<text x="230" y="364" text-anchor="middle" font-size="26" font-weight="700" fill="#111B21">WhatsApp</text>
