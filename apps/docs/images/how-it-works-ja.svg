<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" role="img" aria-label="あなたの AI が zapbip につながると、zapbip は公式の WhatsApp Cloud API を通してメッセージをあなたのスマートフォンへ送ります。あなたの返事は逆向きに届き、AI を起こします。" font-family="system-ui, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#128C7E"/></marker></defs>
<rect x="60" y="20" width="260" height="100" rx="16" fill="#FFFFFF" stroke="#128C7E" stroke-width="3"/>
<text x="190" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#111B21">あなたのAI</text>
<text x="190" y="92" text-anchor="middle" font-size="18" font-weight="400" fill="#111B21">ChatGPT、Claude、Grok</text>
<line x1="190" y1="124" x2="190" y2="166" stroke="#128C7E" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="170" width="260" height="100" rx="16" fill="#D9FDD3" stroke="#128C7E" stroke-width="3"/>
<text x="190" y="214" text-anchor="middle" font-size="26" font-weight="700" fill="#111B21">zapbip</text>
<text x="190" y="242" text-anchor="middle" font-size="18" font-weight="400" fill="#111B21">受信箱とルーティング</text>
<line x1="190" y1="274" x2="190" y2="316" stroke="#128C7E" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="320" width="260" height="100" rx="16" fill="#D9FDD3" stroke="#128C7E" stroke-width="3"/>
<text x="190" y="364" text-anchor="middle" font-size="26" font-weight="700" fill="#111B21">WhatsApp</text>
<text x="190" y="392" text-anchor="middle" font-size="18" font-weight="400" fill="#111B21">Cloud API</text>
<line x1="190" y1="424" x2="190" y2="466" stroke="#128C7E" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="60" y="470" width="260" height="100" rx="16" fill="#FFFFFF" stroke="#128C7E" stroke-width="3"/>
<text x="190" y="530" text-anchor="middle" font-size="26" font-weight="700" fill="#111B21">あなたのスマホ</text>
<path d="M326,520 C396,520 396,70 326,70" fill="none" stroke="#128C7E" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="392" y="300" font-size="16" fill="#128C7E" text-anchor="middle" transform="rotate(90 392 300)">あなたの返事がAIを起こします</text>
</svg>
