name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/install
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      # NB ADR 0033: generated pip install lines begin
      - run: python3 -m pip install --require-hashes -r "$REQUIREMENTS"
        env:
          REQUIREMENTS: apps/hermes-plugin/requirements-dev.txt
      # NB ADR 0033: generated pip install lines end
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:hooks
      - run: pnpm test:verify
      - run: .agents/hooks/doctor.sh
        env:
          GH_TOKEN: ${{ github.token }}
          DOCTOR_SKIP: chromium

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: repository-shape, filter: "@zapbip/repository-shape" }
          # NB ADR 0033: generated unit matrix rows begin
          - { name: hermes-plugin, filter: "@zapbip/hermes-plugin" }
          - { name: openclaw-plugin, filter: "@zapbip/openclaw-plugin" }
          # NB ADR 0033: generated unit matrix rows end
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      # NB ADR 0033: generated pip install lines begin
      - run: python3 -m pip install --require-hashes -r "$REQUIREMENTS"
        env:
          REQUIREMENTS: apps/hermes-plugin/requirements-dev.txt
      # NB ADR 0033: generated pip install lines end
      - run: pnpm --filter "$FILTER" test:unit
        env:
          FILTER: ${{ matrix.filter }}


  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks at a pinned version, verified by checksum
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
      - name: The secret rules fire on a near miss and stay silent on a shipped placeholder
        run: .github/scripts/secret-rules-probe.sh ./gitleaks
      - name: Every commit on every branch and tag is free of secrets
        run: ./gitleaks git --no-banner --redact --exit-code 1 .
      - name: The checked-out tree is free of secrets, merge commits included
        run: ./gitleaks dir --no-banner --redact --exit-code 1 .
      - uses: ./.github/actions/install
      - run: pnpm security:audit
